# Optimized Conlang Navigator

```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Conlang Navigator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Mapbox -->
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />

<!-- Geocoder -->
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
<link
  rel="stylesheet"
  href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css"
  type="text/css"
/>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

#map {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 100%;
}

#routeBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 2;
  padding: 12px 18px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #007AFF;
  color: white;
  cursor: pointer;
}

#routeBtn:hover {
  opacity: 0.9;
}

#instructions {
  position: absolute;
  bottom: 0;
  width: 100%;
  max-height: 40%;
  overflow-y: auto;
  background: white;
  padding: 10px;
  box-sizing: border-box;
  z-index: 2;
}

.instruction {
  margin-bottom: 8px;
}
</style>
</head>

<body>

<button id="routeBtn">Start Route</button>
<div id="map"></div>
<div id="instructions"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoibGFuZ21hcCIsImEiOiJjbWxzaXRta3MwN21vM2ZzNzMyanA4bWEzIn0.lJcTqMBmQsgB5hl44ZZfGg';

// =========================
// MAP SETUP
// =========================

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [-122.4194, 37.7749],
  zoom: 13
});

const instructionBox = document.getElementById('instructions');
const routeBtn = document.getElementById('routeBtn');

let destinationCoords = null;
let startMarker = null;
let endMarker = null;

// =========================
// GEOCODER
// =========================

const geocoder = new MapboxGeocoder({
  accessToken: mapboxgl.accessToken,
  mapboxgl,
  marker: true,
  placeholder: 'Search destination...'
});

map.addControl(geocoder, 'top-right');

geocoder.on('result', (e) => {
  destinationCoords = e.result.center;
});

// =========================
// OPTIONAL BORDER LAYER
// =========================

map.on('load', () => {
  map.addSource('india-border', {
    type: 'geojson',
    data: 'india_official_border.json'
  });

  map.addLayer({
    id: 'india-border',
    type: 'line',
    source: 'india-border',
    paint: {
      'line-color': '#FF9933',
      'line-width': 3
    }
  });
});

// =========================
// ROUTING
// =========================

routeBtn.onclick = async () => {

  if (!destinationCoords) {
    alert('Please search for a destination first.');
    return;
  }

  navigator.geolocation.getCurrentPosition(async (position) => {

    try {

      const start = [
        position.coords.longitude,
        position.coords.latitude
      ];

      const end = destinationCoords;

      createMarkers(start, end);

      const route = await fetchRoute(start, end);

      if (!route) {
        alert('No route found.');
        return;
      }

      drawRoute(route.geometry);
      displayInstructions(route);

    } catch (err) {
      console.error(err);
      alert('Routing failed.');
    }

  }, () => {
    alert('Location access denied.');
  });
};

// =========================
// FETCH ROUTE
// =========================

async function fetchRoute(start, end) {

  const response = await fetch(
    `https://api.mapbox.com/directions/v5/mapbox/driving-traffic/${start.join(',')};${end.join(',')}?steps=true&geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`
  );

  const data = await response.json();

  return data.routes?.[0] || null;
}

// =========================
// DRAW ROUTE
// =========================

function drawRoute(geometry) {

  removeExistingRoute();

  map.addSource('route', {
    type: 'geojson',
    data: {
      type: 'Feature',
      geometry
    }
  });

  map.addLayer({
    id: 'route',
    type: 'line',
    source: 'route',
    paint: {
      'line-color': '#007AFF',
      'line-width': 7,
      'line-cap': 'round',
      'line-join': 'round'
    }
  });

  const bounds = new mapboxgl.LngLatBounds();

  geometry.coordinates.forEach(coord => {
    bounds.extend(coord);
  });

  map.fitBounds(bounds, {
    padding: 50
  });
}

// =========================
// REMOVE OLD ROUTE
// =========================

function removeExistingRoute() {

  if (map.getLayer('route')) {
    map.removeLayer('route');
  }

  if (map.getSource('route')) {
    map.removeSource('route');
  }
}

// =========================
// MARKERS
// =========================

function createMarkers(start, end) {

  if (startMarker) startMarker.remove();
  if (endMarker) endMarker.remove();

  startMarker = new mapboxgl.Marker({ color: 'blue' })
    .setLngLat(start)
    .addTo(map);

  endMarker = new mapboxgl.Marker({ color: 'red' })
    .setLngLat(end)
    .addTo(map);
}

// =========================
// INSTRUCTIONS
// =========================

function displayInstructions(route) {

  instructionBox.innerHTML = '';

  const steps = route.legs.flatMap(leg => leg.steps);
  const lastStepIndex = steps.length - 1;

  steps.forEach((step, index) => {

    const sentence = buildInstruction(step, index, lastStepIndex);

    const p = document.createElement('p');
    p.className = 'instruction';
    p.textContent = sentence;

    instructionBox.appendChild(p);
  });
}

// =========================
// INSTRUCTION GENERATOR
// =========================

function buildInstruction(step, index, lastStepIndex) {

  const type = step.maneuver.type;
  const modifier = step.maneuver.modifier || '';

  const roadName = step.name
  ? step.name.split(';')[0].trim()
  : '';

const roadRef = step.ref
  ? step.ref.split(';')[0].trim()
  : '';

  const isFreeway = roadRef && (
    roadRef.includes('I-') ||
    roadRef.includes('US-') ||
    roadRef.includes('CA-')
  );

  const road = isFreeway
    ? roadRef
    : roadName || roadRef || '';

  const distance = formatDistance(step.distance);

  if (type === 'depart') {
    return 'Depart';
  }

  if (type === 'arrive' && index === lastStepIndex) {
    return 'You have arrived';
  }

  if (type === 'turn') {

    if (!road) {
      return `In ${distance}, continue.`;
    }

    if (modifier === 'left') {
      return `In ${distance}, turn left onto ${road}.`;
    }

    if (modifier === 'right') {
      return `In ${distance}, turn right onto ${road}.`;
    }

    return `In ${distance}, turn onto ${road}.`;
  }

  if (type === 'merge') {
    return road
      ? `Merge onto ${road} in ${distance}.`
      : `Merge in ${distance}.`;
  }

  if (type === 'roundabout') {
    return `Enter the roundabout and continue for ${distance}.`;
  }

  if (road) {
    return `Continue on ${road} for ${distance}.`;
  }

  return `Continue for ${distance}.`;
}

// =========================
// DISTANCE FORMATTER
// =========================

function formatDistance(distance) {

  if (distance >= 1000) {
    return `${(distance / 1000).toFixed(1)} kilometers`;
  }

  return `${Math.round(distance)} meters`;
}

</script>
</body>
</html>
